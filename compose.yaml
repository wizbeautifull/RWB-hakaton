services:
  app:
    build: .
    ports:
      - "127.0.0.1:${MESH_PORT:-8000}:8000"
    environment:
      MESH_YANDEX_MAPS_KEY: "${MESH_YANDEX_MAPS_KEY:-}"
    volumes:
      - orders:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  orders:
